# CI 项目
name: zerowrt-core

# CI 计划
on:
  # 工作流调用
  workflow_call:
    inputs:
      WRT_TEST:
        required: true
        type: boolean
      WRT_ONLY_CONFIG:
        required: true
        type: boolean
      WRT_CONFIG:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_HOST:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string

# CI 环境
env:
  # GITHUB ENV
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  # WRT ENV
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_ONLY_CONFIG: ${{inputs.WRT_ONLY_CONFIG}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_HOST: ${{inputs.WRT_HOST}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}

# CI 任务
jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
      source_hash: ${{steps.clone-code.outputs.source_hash}}
    steps:
      - name: FreeDiskSpace
        if: env.WRT_ONLY_CONFIG == 'false'
        uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          testing: false

      - name: Checkout
        uses: actions/checkout@main

      - name: InitWorkflow
        run: |
          workflowPath="$RUNNER_TEMP/Workflow-$(uuidgen | tr -d '-')"
          git clone --depth=1 https://github.com/zero-dream/github-action.git "$workflowPath/" || exit 1
          chmod +x "$workflowPath/zerodream/init/init.sh"
          bash "$workflowPath/zerodream/init/init.sh"
          rm -rf "$workflowPath/"

      - name: InitRepository
        run: |
          # Hook
          source "$ZD_LibPath/hook.sh"
          hook 'ZeroWrtCore/InitRepository'

      - name: InitCompile
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          sudo bash "$CI_ScriptPath/CompileEnv.sh"

      - name: InitKeyValue
        id: initialize-values
        run: |
          source "$ZD_LibPath/setEnv.sh"
          source "$ZD_LibPath/setOut.sh"
          source "$ZD_LibPath/createPath.sh"
          setEnv 'ZERO_LIB_REPO' "$ZD_Owner/github-library"
          setEnv 'CI_Date' "$(TZ=UTC date '+%y%m%d')"
          setEnv 'CI_Owner' "${GITHUB_REPOSITORY%%/*}"
          setEnv 'CI_PrivatePath' "$GITHUB_WORKSPACE/private"
          setEnv 'CI_TempPath' "$(createTempPath 'CiTemp:dir')"
          setEnv 'CI_VirtualPath' "$(createTempPath 'CiVirtual:dir')"
          setEnv 'WRT_NAME' 'ZeroWrt'
          setEnv 'WRT_INFO' "${WRT_SOURCE%%/*}"
          setEnv 'WRT_WIFI' 'wifi-yes'
          setEnv 'WRT_KVER' 'none'
          setEnv 'WRT_LIST' 'none'
          setEnv 'WRT_MainPath' "$GITHUB_WORKSPACE/$WRT_NAME"
          setEnv 'WRT_ConfigPath' "$WRT_MainPath/.config"
          setEnv 'WRT_TARGET' "$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "$CI_ConfigPath/Platform/$WRT_CONFIG")"
          setEnv 'WRT_SUBTARGET' "$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[\w]+(?=\=y)" "$CI_ConfigPath/Platform/$WRT_CONFIG")"

          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          setEnv 'WRT_CACHE_TARGET' "$WRT_TARGET-$WRT_SUBTARGET"
          setEnv 'WRT_CACHE_PREFIX' "wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          setOut 'cache_prefix' "$WRT_CACHE_PREFIX"

          # Hook
          source "$ZD_LibPath/hook.sh"
          hook 'ZeroWrtCore/InitEnvVar'

      - name: Verify
        run: |
          # Hook
          source "$ZD_LibPath/hook.sh"
          hook 'ZeroWrtCore/Verify'

      - name: CloneCode
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" "$WRT_MainPath/"

          cd "$WRT_MainPath/"
          source "$ZD_LibPath/setEnv.sh"
          source "$ZD_LibPath/setOut.sh"
          setEnv 'WRT_HASH' "$(git rev-parse HEAD)"
          setEnv 'WRT_CACHE_KEY' "$WRT_CACHE_PREFIX-$WRT_HASH"
          setOut 'cache_key' "$WRT_CACHE_PREFIX-$WRT_HASH"
          setOut 'source_hash' "$WRT_HASH"

          # 删除指定下载源
          PROJECT_MIRRORS_FILE="$WRT_MainPath/scripts/projectsmirrors.json"
          if [[ -f "$PROJECT_MIRRORS_FILE" ]]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: CopyOpenwrtFile
        run: |
          cp -a "$GITHUB_WORKSPACE/openwrt/." "$WRT_MainPath/"

      - name: RestoreBuildCache
        id: cache-restore
        if: env.WRT_TEST == 'false' && env.WRT_ONLY_CONFIG == 'false'
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ${{env.WRT_MainPath}}/.ccache
            ${{env.WRT_MainPath}}/staging_dir/host*
            ${{env.WRT_MainPath}}/staging_dir/tool*

      - name: PrepareRestoredBuildCache
        if: env.WRT_TEST == 'false' && env.WRT_ONLY_CONFIG == 'false' && steps.cache-restore.outputs.cache-matched-key != ''
        run: |
          find "$WRT_MainPath/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p "$WRT_MainPath/tmp"
          echo "1" > "$WRT_MainPath/tmp/.build"
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: UpdateFeeds
        run: |
          cd "$WRT_MainPath/"
          "$WRT_MainPath/scripts/feeds" update -a
          "$WRT_MainPath/scripts/feeds" install -a
          # Hook
          source "$ZD_LibPath/hook.sh"
          hook 'ZeroWrtCore/UpdateFeeds'
        env:
          GH_TOKEN: ${{secrets.WORKFLOW_TOKEN}}
          ZeroDream_Secret: ${{secrets.ZERODREAM_SECRET}}
          ZeroWrt_Secret: ${{secrets.ZEROWRT_SECRET}}

      - name: HandleConfig
        run: |
          bash "$CI_ScriptPath/FirmwareConfig.sh"
          # Hook
          source "$ZD_LibPath/hook.sh"
          hook 'ZeroWrtCore/HandleConfig'
        env:
          GH_TOKEN: ${{secrets.WORKFLOW_TOKEN}}
          ZeroDream_Secret: ${{secrets.ZERODREAM_SECRET}}

      - name: HandlePackage
        run: |
          bash "$CI_ScriptPath/FirmwarePackage.sh"
          bash "$CI_ScriptPath/FirmwareHandle.sh"
          # Hook
          source "$ZD_LibPath/hook.sh"
          hook 'ZeroWrtCore/HandlePackage'
        env:
          GH_TOKEN: ${{secrets.WORKFLOW_TOKEN}}
          ZeroDream_Secret: ${{secrets.ZERODREAM_SECRET}}
          ZeroWrt_ApiToken: ${{secrets.ZEROWRT_APITOKEN}}
          ZeroWrt_Secret: ${{secrets.ZEROWRT_SECRET}}

      - name: HandleSetting
        run: |
          bash "$CI_ScriptPath/FirmwareSettings.sh"
          # Hook
          source "$ZD_LibPath/hook.sh"
          hook 'ZeroWrtCore/HandleSetting'
        env:
          GH_TOKEN: ${{secrets.WORKFLOW_TOKEN}}
          ZeroDream_Secret: ${{secrets.ZERODREAM_SECRET}}

      - name: SortingConfig
        run: |
          bash "$CI_ScriptPath/SortingConfig.sh"

      - name: MakeDefconfig
        run: |
          cd "$WRT_MainPath/"
          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: MakeDownload
        if: env.WRT_ONLY_CONFIG == 'false'
        run: |
          cd "$WRT_MainPath/"
          make download -j$(nproc) || make download -j1 V=s

      - name: CompileFirmware
        if: env.WRT_ONLY_CONFIG == 'false'
        run: |
          cd "$WRT_MainPath/"
          make -j$(nproc) || make -j1 V=s

      - name: CheckCacheSource
        id: cache-source
        if: env.WRT_TEST == 'false' && env.WRT_ONLY_CONFIG == 'false' && success()
        run: |
          source "$ZD_LibPath/setOut.sh"
          REMOTE_HASH=$(git ls-remote "$WRT_REPO" "refs/heads/$WRT_BRANCH" | awk 'NR == 1 {print $1}')
          if [ -n "$REMOTE_HASH" ] && [ "$REMOTE_HASH" = "$WRT_HASH" ]; then
            setOut 'current' 'true'
          else
            setOut 'current' 'false'
            echo "skip cache save: source branch is now ${REMOTE_HASH:-unknown}, built $WRT_HASH"
          fi

      - name: SaveBuildCache
        if: >-
          env.WRT_TEST == 'false' && env.WRT_ONLY_CONFIG == 'false' && success() &&
          steps.cache-source.outputs.current == 'true' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ${{env.WRT_MainPath}}/.ccache
            ${{env.WRT_MainPath}}/staging_dir/host*
            ${{env.WRT_MainPath}}/staging_dir/tool*

      - name: MachineInformation
        run: |
          cd "$WRT_MainPath/"
          echo "===================="
          lscpu | grep -E "name|Core|Thread"
          echo "===================="
          df -h
          echo "===================="
          du -h --max-depth=1
          echo "===================="

      - name: SetCompileEnv
        run: |
          cd "$WRT_MainPath/"
          echo "WRT_KVER=$(find "$WRT_MainPath/bin/targets/" -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >>$GITHUB_ENV
          echo "WRT_LIST=$(find "$WRT_MainPath/bin/targets/" -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >>$GITHUB_ENV

      - name: HandleData
        run: |
          # Hook
          source "$ZD_LibPath/hook.sh"
          hook 'ZeroWrtCore/HandleData'
        env:
          GH_TOKEN: ${{secrets.WORKFLOW_TOKEN}}
          ZeroDream_Secret: ${{secrets.ZERODREAM_SECRET}}
          ZeroWrt_Secret: ${{secrets.ZEROWRT_SECRET}}

      - name: CollectArtifact
        run: |
          # Hook
          source "$ZD_LibPath/hook.sh"
          hook 'ZeroWrtCore/CollectArtifact'
        env:
          GH_TOKEN: ${{secrets.WORKFLOW_TOKEN}}
          ZeroDream_Secret: ${{secrets.ZERODREAM_SECRET}}
          ZeroWrt_Secret: ${{secrets.ZEROWRT_SECRET}}

      - name: CollectRelease
        run: |
          # SetEnv
          source "$ZD_LibPath/setEnv.sh"
          source "$ZD_LibPath/createPath.sh"
          setEnv 'CI_ReleaseBodyPath' "$(createTempPath 'CiReleaseBody:file')"
          # Hook
          source "$ZD_LibPath/hook.sh"
          hook 'ZeroWrtCore/CollectRelease'
          # UploadReleaseBodyEnv
          echo 'CI_ReleaseBody<<EOF' >>$GITHUB_ENV
          cat "$CI_ReleaseBodyPath" >>$GITHUB_ENV
          echo 'EOF' >>$GITHUB_ENV

      - name: UploadArtifact
        uses: actions/upload-artifact@main
        with:
          name: ${{env.WRT_NAME}}-${{env.CI_Date}}-Artifact-${{env.WRT_CONFIG}}-${{env.ZD_DateUTC}}
          path: ${{env.ZD_ArtifactUploadPath}}/
          retention-days: 1 # 保留附件天数，最大值为 90 天

      - name: UploadRelease
        if: env.WRT_TEST == 'false' && env.WRT_ONLY_CONFIG == 'false'
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_NAME}}-${{env.CI_Date}}-Firmware-${{env.WRT_CONFIG}}-${{env.ZD_DateUTC}}
          files: ${{env.ZD_ReleaseUploadPath}}/**
          body: ${{env.CI_ReleaseBody}}

  cache-rollover:
    name: RollCacheGenerations
    needs: core
    if: inputs.WRT_TEST == 'false' && inputs.WRT_ONLY_CONFIG == 'false' && needs.core.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_BRANCH: ${{inputs.WRT_BRANCH}}
      WRT_REPO: ${{inputs.WRT_REPO}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
      WRT_SOURCE_HASH: ${{needs.core.outputs.source_hash}}
    steps:
      - name: RollBuildCache
        run: |
          set -euo pipefail

          delete_cache_key() {
            local exact_key="$1"
            gh cache list --repo "$GH_REPO" --key "$exact_key" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
              while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
                [ "$CACHE_KEY" = "$exact_key" ] || continue
                gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                  echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
              done
          }

          REMOTE_HASH=$(git ls-remote "$WRT_REPO" "refs/heads/$WRT_BRANCH" | awk 'NR == 1 {print $1}')
          if [ -z "$REMOTE_HASH" ] || [ "$REMOTE_HASH" != "$WRT_SOURCE_HASH" ]; then
            echo "remove stale cache generation: source branch is now ${REMOTE_HASH:-unknown}, built $WRT_SOURCE_HASH"
            delete_cache_key "$WRT_CACHE_KEY"
            exit 0
          fi

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done
