# CI 项目
name: build-test

# CI 权限
permissions: write-all

# CI 计划
on:
  # 手动运行
  workflow_dispatch:
    inputs:
      CONFIG:
        description: 'CONFIG'
        required: true
        type: choice
        default: 'IPQ60XX-WIFI-NO'
        options:
          - IPQ60XX-WIFI-NO
          - IPQ60XX-WIFI-YES
          - IPQ807X-WIFI-NO
          - IPQ807X-WIFI-YES
          - MEDIATEK-WIFI-NO
          - MEDIATEK-WIFI-YES
          - ROCKCHIP
          - X86
      SOURCE:
        description: 'SOURCE'
        required: true
        type: choice
        default: 'zero-dream/zerowrt-immortalwrt'
        options:
          - zero-dream/zerowrt-immortalwrt
          - VIKINGYFY/immortalwrt
          - immortalwrt/immortalwrt
      BRANCH:
        description: 'BRANCH'
        required: true
        type: string
        default: 'owrt'
      ONLY_CONFIG:
        description: '是否仅生成配置'
        required: true
        type: boolean
        default: false

# CI 任务
jobs:
  build:
    name: ${{inputs.CONFIG}}
    # 重用工作流文件
    uses: ./.github/workflows/zerowrt-core.yml
    secrets: inherit
    with:
      # 测试模式
      WRT_TEST: true
      # 是否仅生成配置
      WRT_ONLY_CONFIG: ${{inputs.ONLY_CONFIG || false}} # 为自动编译设置默认值
      # 编译配置
      WRT_CONFIG: ${{inputs.CONFIG}}
      # 源码名称
      WRT_SOURCE: ${{inputs.SOURCE}}
      # 源码分支
      WRT_BRANCH: ${{inputs.BRANCH}}
      # 源码链接
      WRT_REPO: https://github.com/${{inputs.SOURCE}}.git
      # 默认主题
      WRT_THEME: argon
      # 默认主机名
      WRT_HOST: ZeroWrt
      # 默认 WiFi 名称
      WRT_SSID: ZeroWrt
      # 默认 WiFi 密码
      WRT_WORD: 12345678
      # 默认地址
      WRT_IP: 192.168.10.1
      # 默认密码，仅供提示，修改无效
      WRT_PW: 无
